name: Release

# Tags vMAJOR.MINOR.PATCH publish a release.
# Pull requests and manual runs build a downloadable dry-run artifact only.
on:
  push:
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - 'WiFiSurvey.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test and package (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Release tag must be vMAJOR.MINOR.PATCH (for example, v1.2.3).'
            }
          } else {
            $version = "0.0.0-dryrun.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test WiFiSurvey.sln --configuration Release

      - name: Publish
        run: dotnet publish WiFiSurvey.csproj --configuration Release --output publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Package and verify version
        id: pkg
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $exe = 'publish/WiFiSurvey.exe'
          if (-not (Test-Path $exe)) {
            throw "Published executable not found: $exe"
          }
          $expected = $env:RELEASE_VERSION.Split('-')[0] + '.0'
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          if ($actual -ne $expected) {
            throw "EXE FileVersion '$actual' does not match expected '$expected'."
          }
          Copy-Item -Path README.md, LICENSE -Destination publish -ErrorAction Stop
          $zip = "WiFiSurvey-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" |
            Out-File -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: WiFiSurvey-win-x64
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged build
        uses: actions/download-artifact@v8
        with:
          name: WiFiSurvey-win-x64

      - name: Verify checksum and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          archives=(WiFiSurvey-*-win-x64.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo 'Expected exactly one ZIP artifact.' >&2
            exit 1
          fi
          archive="${archives[0]}"
          sha256sum --check "$archive.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" "$archive.sha256" \
            --title "Wi-Fi Survey $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
